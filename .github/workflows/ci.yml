name: CI

on:
  push:
    branches:
      - "codex/**"
      - master
  pull_request:
    branches:
      - master

# Newer pushes cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: pytest
        run: uv run pytest -q

      - name: ruff
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

  web:
    name: web (test, lint, tsc, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Playwright's fixture server and live-update step invoke the installed
      # agentharness package from a repo-root .venv (see web/playwright.config.ts).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync Python dependencies (fixture server)
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Unit tests
        working-directory: web
        run: npm run test

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build web bundle
        working-directory: web
        run: npx vite build

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (desktop + mobile)
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: output/playwright
          if-no-files-found: ignore
