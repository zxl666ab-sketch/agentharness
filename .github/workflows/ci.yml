name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Java unit + Testcontainers integration tests
        working-directory: procurement-service
        run: ./mvnw -B test
      - name: Java golden contract
        working-directory: procurement-service
        run: ./mvnw -B -q -Dtest=FrozenComparisonContractTest test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Install browser and CJK font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-ukai
          uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run pytest --cov=agentharness --cov-report=term --cov-fail-under=80 -q
      - run: uv build
      - run: uv run python scripts/evaluate_procurement.py run --output output/ci-procurement-evaluation
      - run: uv run python scripts/evaluate_procurement.py verify --input output/ci-procurement-evaluation/raw-results.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python scripts/check_web_build_determinism.py
      - name: Verify Java static bundle is in sync
        run: |
          rm -rf procurement-service/src/main/resources/static
          cp -R web/dist procurement-service/src/main/resources/static
          git diff --exit-code -- procurement-service/src/main/resources/static || {
            echo "procurement-service static bundle differs from web/dist; rebuild and commit it"
            exit 1
          }