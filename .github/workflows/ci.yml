name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run pytest --cov=agentharness --cov-report=term --cov-fail-under=80 -q
      - run: uv build
      - run: uv run python scripts/evaluate_procurement.py run --output output/ci-procurement-evaluation
      - run: uv run python scripts/evaluate_procurement.py verify --input output/ci-procurement-evaluation/raw-results.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: python scripts/check_web_build_determinism.py
      - run: git diff --exit-code -- src/agentharness/web_dist
      - name: Reject untracked Web bundle files
        run: |
          untracked="$(git ls-files --others --exclude-standard -- src/agentharness/web_dist)"
          if [ -n "$untracked" ]; then
            printf 'Untracked Web bundle files:\n%s\n' "$untracked"
            exit 1
          fi
