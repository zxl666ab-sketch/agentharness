openapi: 3.1.0
info:
  title: Caijiatai Python Agent Internal API
  version: 0.5.0
  description: Internal-only API used by the Java procurement control plane.
servers:
  - url: http://agent:8742
security:
  - InternalToken: []
paths:
  /api/health:
    get:
      security: []
      operationId: agentHealth
      responses:
        '200':
          description: Agent health and runtime capabilities.
          content:
            application/json:
              schema: {type: object}
  /internal/v1/commands:
    post:
      operationId: executeAgentCommand
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/PayloadSha256'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCommand'
      responses:
        '200':
          description: Existing or newly completed idempotent result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCommandResult'}
        '202':
          description: Command accepted and still running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCommandResult'}
        '409':
          description: Same operation id was previously used with a different payload.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /internal/v1/operations/{operationId}:
    get:
      operationId: getAgentOperation
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Persisted operation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCommandResult'}
        '404':
          description: Unknown operation.
  /api/runs/{runId}:
    get:
      operationId: getRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Run, content: {application/json: {schema: {type: object}}}}
  /api/runs/{runId}/report:
    get:
      operationId: getRunReport
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Runtime report, content: {application/json: {schema: {type: object}}}}
  /api/runs/{runId}/messages:
    get:
      operationId: getRunMessages
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Run messages, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /api/runs/{runId}/events:
    get:
      operationId: getRunEvents
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Run events, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /api/runs/{runId}/approvals:
    get:
      operationId: getRunApprovals
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Run approvals, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /api/runs/{runId}/tool-invocations:
    get:
      operationId: getRunToolInvocations
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Tool invocations, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /api/runs/{runId}/checkpoint:
    get:
      operationId: getRunCheckpoint
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Checkpoint, content: {application/json: {schema: {type: object}}}}
  /api/sessions:
    get:
      operationId: listSessions
      responses:
        '200': {description: Sessions, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /api/sessions/{sessionId}/transcript:
    get:
      operationId: getSessionTranscript
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200': {description: Transcript, content: {application/json: {schema: {type: object}}}}
  /api/tool-invocations/{invocationId}:
    get:
      operationId: getToolInvocation
      parameters:
        - name: invocationId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200': {description: Tool invocation, content: {application/json: {schema: {type: object}}}}
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Agent-Internal-Token
  parameters:
    OperationId:
      name: X-Operation-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    PayloadSha256:
      name: X-Payload-SHA256
      in: header
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  schemas:
    AgentCommand:
      type: object
      additionalProperties: false
      required: [operation_id, operation_type, aggregate_id, generation, expected_task_version, payload_sha256, payload]
      properties:
        operation_id: {type: string, format: uuid}
        operation_type: {type: string, enum: [start_conversation, import_quote, resume_run, human_interaction_answer, analyze, approve_decision, create_structured, reopen_task, parse_invoice, explain_invoice_diff, draft_contract]}
        aggregate_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        generation: {type: integer, minimum: 1}
        expected_task_version: {type: integer, minimum: 0}
        payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        payload: {type: object}
    AgentCommandResult:
      type: object
      required: [operation_id, status]
      properties:
        operation_id: {type: string, format: uuid}
        status: {type: string, enum: [accepted, completed, failed]}
        result: {type: [object, 'null']}
        error: {type: [string, 'null']}
    ErrorResponse:
      type: object
      required: [code, message, request_id, status]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string, format: uuid}
        status: {type: integer}
