openapi: 3.1.0
info:
  title: Caijiatai Java Procurement Internal API
  version: 0.4.0
  description: Narrow callback and artifact API used only by the Python Agent service.
x-rpc-kinds:
  get_reference_prices:
    description: "K5 历史报价 RAG 数据真源：聚合历史已批准订单成交价，按物料名归一化匹配 + 品类兜底。"
    request:
      type: object
      required: [task_id, item_name, category]
      properties:
        task_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        item_name: {type: string}
        category: {type: string}
    response:
      type: object
      required: [task_id, item_name, category, records, interval]
      properties:
        task_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        item_name: {type: string}
        category: {type: string}
        records:
          type: array
          items:
            type: object
            required: [task_id, reference, supplier_name, item_name, category, quantity, landed_total, landed_unit, created_at]
            properties:
              task_id: {type: string, pattern: '^[0-9a-f]{32}$'}
              reference: {type: string}
              supplier_name: {type: string}
              item_name: {type: string}
              category: {type: string}
              quantity: {type: string}
              landed_total: {type: string}
              landed_unit: {type: string}
              created_at: {type: string, format: date-time}
        interval:
          oneOf:
            - type: object
              required: [p25, p75, p25_unit, p75_unit, count, basis]
              properties:
                p25: {type: string}
                p75: {type: string}
                p25_unit: {type: string}
                p75_unit: {type: string}
                count: {type: integer, minimum: 3}
                basis: {type: string, const: landed_total_base}
            - {type: 'null'}
  get_task_context:
    description: Current authoritative task context for the Python Agent.
    request:
      type: object
      required: [task_id]
      properties:
        task_id: {type: string, pattern: '^[0-9a-f]{32}$'}
    response: {type: object}
  get_artifact:
    description: Original business artifact bytes (base64, up to 2MB).
    request:
      type: object
      required: [artifact_id]
      properties:
        artifact_id: {type: string, pattern: '^jb[0-9a-f]{32}$'}
    response: {type: object}
  list_events:
    description: Runtime events after a global sequence.
    request:
      type: object
      required: [after_seq]
      properties:
        after_seq: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
    response: {type: object}
servers:
  - url: http://procurement:8741
security:
  - InternalToken: []
paths:
  /internal/v1/tasks/{taskId}/context:
    get:
      operationId: getTaskAgentContext
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Current authoritative task context.
          content:
            application/json:
              schema: {type: object}
        '404': {description: Unknown task}
  /internal/v1/artifacts/{artifactId}/raw:
    get:
      operationId: readBusinessArtifact
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: {type: string, pattern: '^jb[0-9a-f]{32}$'}
      responses:
        '200':
          description: Original artifact bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {description: Unknown Java-owned artifact}
  /internal/v1/operations/{operationId}/result:
    post:
      operationId: submitAgentOperationResult
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload_sha256, status, result]
              properties:
                payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                status: {type: string, enum: [completed, failed]}
                result: {type: object}
                error: {type: [string, 'null']}
      responses:
        '200': {description: Existing idempotent application result}
        '409': {description: Payload or task generation is stale}
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Agent-Internal-Token
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
