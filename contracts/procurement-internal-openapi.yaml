openapi: 3.1.0
info:
  title: Caijiatai Java Procurement Internal API
  version: 0.5.0
  description: >-
    Narrow callback and artifact API used only by the Python Agent service.
    Production transport is Kafka RPC with HMAC envelopes (KafkaRpcServer.java,
    active when app.agent-mode=kafka): the Python RpcClient publishes a request to
    topic caijiatai.rpc.requests and receives the reply on caijiatai.rpc.responses,
    correlated by correlation_id. The request envelope carries
    {correlation_id, kind, payload, reply_to, request_sha256, signature}; the response
    envelope carries {correlation_id, status(ok|error), result, error,
    request_sha256, processed_at, signature}. "signature" is hex HMAC-SHA256 over the
    canonical JSON of the envelope minus the signature field (MessageCodec); both ends
    also verify request_sha256 against the canonical payload. The server dispatches on
    "kind" to exactly the RPC kinds listed under x-rpc-kinds; any other kind fails with
    unknown_rpc_kind. The HTTP paths below (X-Agent-Internal-Token) are LEGACY:
    loopback-only compatibility surface; the current Java build serves no HTTP internal
    plane, and the Python client maps those paths onto the Kafka RPC kinds.
x-rpc-topics:
  requests: caijiatai.rpc.requests
  responses: caijiatai.rpc.responses
  consumer_group: java-svc-rpc
x-rpc-kinds:
  get_task_context:
    description: Current authoritative task context for the Python Agent.
    request:
      type: object
      required: [task_id]
      properties:
        task_id: {type: string, pattern: '^[0-9a-f]{32}$'}
    response: {$ref: '#/components/schemas/TaskAgentContext'}
  get_artifact:
    description: >-
      Original business artifact bytes, base64-encoded in the JSON result
      ({artifact_id, task_id, filename, content_type, sha256, size_bytes, base64});
      up to 2MB, larger files fail with artifact_too_large (chunking is a phase-2 item).
    request:
      type: object
      required: [artifact_id]
      properties:
        artifact_id: {type: string, pattern: '^jb[0-9a-f]{32}$'}
    response: {type: object}
  list_events:
    description: >-
      Runtime events after a global sequence; result is
      {events: [{global_seq, task_id, run_id, type, payload, occurred_at}], next_after_seq}.
    request:
      type: object
      required: [after_seq]
      properties:
        after_seq: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
    response: {type: object}
servers:
  - url: http://procurement:8741
x-legacy-http-plane:
  description: >-
    The paths below document the LEGACY loopback-only HTTP+token plane. Each maps to
    a Kafka RPC kind on the production plane; the current Java build exposes none of
    them over HTTP, and operation results are delivered on topic caijiatai.results.
  path_to_rpc_kind:
    /internal/v1/tasks/{taskId}/context: get_task_context
    /internal/v1/artifacts/{artifactId}/raw: get_artifact
    /internal/v1/operations/{operationId}/result: "caijiatai.results topic (agent.result / ai_task.result message)"
security:
  - InternalToken: []
paths:
  /internal/v1/tasks/{taskId}/context:
    get:
      operationId: getTaskAgentContext
      x-legacy: true
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Current authoritative task context.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskAgentContext'}
        '404': {description: Unknown task}
  /internal/v1/artifacts/{artifactId}/raw:
    get:
      operationId: readBusinessArtifact
      x-legacy: true
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: {type: string, pattern: '^jb[0-9a-f]{32}$'}
      responses:
        '200':
          description: Original artifact bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {description: Unknown Java-owned artifact}
  /internal/v1/operations/{operationId}/result:
    post:
      operationId: submitAgentOperationResult
      x-legacy: true
      description: >-
        On the production plane results are NOT posted over HTTP; the agent publishes
        a signed agent.result / ai_task.result envelope to topic caijiatai.results.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload_sha256, status, result]
              properties:
                payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                status: {type: string, enum: [completed, failed]}
                result: {type: object}
                error: {type: [string, 'null']}
      responses:
        '200': {description: Existing idempotent application result}
        '409': {description: Payload or task generation is stale}
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Agent-Internal-Token
      description: >-
        LEGACY only, loopback HTTP mode. The production Java-side plane is Kafka RPC
        with per-envelope HMAC-SHA256 signatures (shared internal HMAC key); see
        x-rpc-topics and x-rpc-kinds.
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  schemas:
    AuthorizedArtifact:
      type: object
      additionalProperties: false
      required: [artifact_id, filename, sha256, content_type, size_bytes]
      properties:
        artifact_id: {type: string, pattern: '^jb[0-9a-f]{32}$'}
        filename: {type: string, minLength: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        content_type: {type: string, minLength: 1}
        size_bytes: {type: integer, minimum: 0}
    HumanInteractionContext:
      type: object
      additionalProperties: false
      required: [interaction_id, run_id, checkpoint_id, generation, status, answer_schema, answer, note, artifact_ids]
      properties:
        interaction_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        run_id: {type: [string, 'null'], pattern: '^[0-9a-f]{32}$'}
        checkpoint_id: {type: [string, 'null'], minLength: 1, maxLength: 64}
        generation: {type: integer, minimum: 1}
        status: {$ref: './procurement-workbench.schema.json#/$defs/HumanInteractionStatus'}
        answer_schema: {$ref: './procurement-workbench.schema.json#/$defs/HumanInteractionAnswerSchema'}
        answer: {}
        note: {type: [string, 'null'], maxLength: 2000}
        artifact_ids:
          type: [array, 'null']
          items: {type: string, pattern: '^jb[0-9a-f]{32}$'}
          maxItems: 20
          uniqueItems: true
    TaskAgentContext:
      type: object
      additionalProperties: true
      required: [id, generation, task_version, quantity, unit, requirement_confirmed, attachments, authorized_artifacts, source_message, interactions, pending_decisions]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        generation: {type: integer, minimum: 1}
        task_version: {type: integer, minimum: 0}
        quantity: {type: [string, 'null']}
        unit: {type: [string, 'null']}
        requirement_confirmed: {type: boolean}
        analysis_run_id: {type: [string, 'null'], pattern: '^[0-9a-f]{32}$'}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/AuthorizedArtifact'}
        authorized_artifacts:
          type: array
          items: {$ref: '#/components/schemas/AuthorizedArtifact'}
        source_message: {type: string}
        interactions:
          type: array
          items: {$ref: '#/components/schemas/HumanInteractionContext'}
        pending_decisions: {type: array, items: {type: object}}
