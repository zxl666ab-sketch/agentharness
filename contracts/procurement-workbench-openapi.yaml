openapi: 3.1.0
info:
  title: Caijiatai Procurement Workbench API
  version: 1.1.0
  description: Public workbench API. Java is the owner of every resource in this contract.
servers:
  - url: http://127.0.0.1:8741
paths:
  /api/procurement/requests/{businessId}/ai-tasks:
    post:
      operationId: createAiTask
      parameters: [{$ref: '#/components/parameters/BusinessId'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAiTaskRequest'}
      responses:
        '202':
          description: Durable AI task and outbox command were created atomically.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/AiTaskView'}
        '409': {description: Idempotency conflict, stale generation, invalid task state, or incomplete quotes and confirmed requirements.}
  /api/procurement/ai-tasks:
    get:
      operationId: listAiTasks
      parameters:
        - {$ref: '#/components/parameters/AiStatus'}
        - {$ref: '#/components/parameters/AiTaskType'}
        - {$ref: '#/components/parameters/BusinessIdQuery'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Filtered AI task page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskPage'
  /api/procurement/ai-tasks/{aiTaskId}:
    get:
      operationId: getAiTask
      parameters: [{$ref: '#/components/parameters/AiTaskId'}]
      responses:
        '200':
          description: AI task with stable ordered step records and current result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiTaskDetail'}
        '404': {description: Unknown AI task.}
  /api/procurement/ai-tasks/{aiTaskId}/retry:
    post:
      operationId: retryAiTask
      parameters:
        - {$ref: '#/components/parameters/AiTaskId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: The same AI task was scheduled for its next bounded attempt.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/AiTaskView'}
        '409': {description: Non-retryable, stale, terminal, or idempotency conflict.}
  /api/procurement/ai-tasks/{aiTaskId}/cancel:
    post:
      operationId: cancelAiTask
      parameters:
        - {$ref: '#/components/parameters/AiTaskId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Pending or running task was marked cancelled.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/AiTaskView'}
        '409': {description: Task can no longer be cancelled.}
  /api/procurement/reviews:
    get:
      operationId: listReviews
      parameters:
        - name: status
          in: query
          schema: {$ref: './procurement-workbench.schema.json#/$defs/ReviewStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Human review queue.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPage'}
  /api/procurement/reviews/{reviewId}:
    get:
      operationId: getReview
      parameters: [{$ref: '#/components/parameters/ReviewId'}]
      responses:
        '200':
          description: Review, AI result, quote evidence and immutable history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDetail'}
        '404': {description: Unknown review.}
  /api/procurement/reviews/{reviewId}/actions:
    post:
      operationId: submitReviewAction
      parameters:
        - {$ref: '#/components/parameters/ReviewId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/ReviewActionRequest'}
      responses:
        '200':
          description: Existing or newly applied idempotent review result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDetail'}
        '409': {description: Evidence, version, generation, or idempotency conflict.}
        '422': {description: Required reason or revised value is missing.}
  /api/procurement/suppliers:
    get:
      operationId: listSuppliers
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - name: status
          in: query
          schema: {$ref: './procurement-workbench.schema.json#/$defs/SupplierStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paged supplier list with derived quote/win counts and performance score.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPage'
    post:
      operationId: createSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/SupplierSaveRequest'}
      responses:
        '200':
          description: Created supplier view.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/SupplierView'}
        '400': {description: Invalid name or status.}
        '409': {description: Duplicate supplier name.}
  /api/procurement/suppliers/{supplierId}:
    put:
      operationId: updateSupplier
      parameters: [{$ref: '#/components/parameters/SupplierId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/SupplierSaveRequest'}
      responses:
        '200':
          description: Updated supplier view.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/SupplierView'}
        '400': {description: Name is immutable or status invalid.}
        '404': {description: Unknown supplier.}
    delete:
      operationId: deleteSupplier
      parameters: [{$ref: '#/components/parameters/SupplierId'}]
      responses:
        '204':
          description: Supplier physically deleted (only when no quote history exists).
        '404': {description: Unknown supplier.}
        '409': {description: Supplier has quote history; suspend or blacklist instead.}
  /api/procurement/suppliers/{supplierId}/profile:
    get:
      operationId: getSupplierProfile
      parameters: [{$ref: '#/components/parameters/SupplierId'}]
      responses:
        '200':
          description: Supplier profile aggregation (quotes, wins, performance, items, recent quotes).
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/SupplierProfileView'}
        '404': {description: Unknown supplier.}
  /api/procurement/orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema: {$ref: './procurement-workbench.schema.json#/$defs/OrderStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paged purchase orders. Formal approval creates the unique order transactionally; this query is read-only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPage'}
  /api/procurement/orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
      responses:
        '200':
          description: Order detail with artifacts and settlement.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/OrderView'}
        '404': {description: Unknown order.}
  /api/procurement/orders/{orderId}/transition:
    post:
      operationId: transitionOrder
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/OrderTransitionRequest'}
      responses:
        '200':
          description: Order after transition (ship/receive/close).
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/OrderView'}
        '400': {description: Missing receive fields or invalid action.}
        '404': {description: Unknown order.}
        '409': {description: Illegal transition, over-receipt, missing landed cost, version conflict, or idempotency payload conflict.}
  /api/procurement/settlements:
    get:
      operationId: listSettlements
      parameters:
        - name: status
          in: query
          schema: {$ref: './procurement-workbench.schema.json#/$defs/SettlementStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paged settlements derived from received orders.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettlementPage'}
  /api/procurement/settlements/{settlementId}/transition:
    post:
      operationId: transitionSettlement
      parameters:
        - {$ref: '#/components/parameters/SettlementId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/SettlementTransitionRequest'}
      responses:
        '200':
          description: Settlement after transition (settle/pay).
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/SettlementView'}
        '400': {description: Missing paid_at or invalid action.}
        '404': {description: Unknown settlement.}
        '409': {description: Illegal transition, invoice gate, version conflict, or idempotency payload conflict.}
  /api/procurement/insights/overview:
    get:
      operationId: insightsOverview
      responses:
        '200':
          description: Cockpit overview (status funnel, cost savings, domain counts).
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/InsightsOverview'}
  /api/procurement/insights/trend:
    get:
      operationId: insightsTrend
      parameters:
        - name: months
          in: query
          schema: {type: integer, minimum: 1, maximum: 24, default: 6}
      responses:
        '200':
          description: Monthly task counts and approved amounts.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: './procurement-workbench.schema.json#/$defs/InsightTrendRow'}
  /api/procurement/insights/supplier-ranking:
    get:
      operationId: insightsSupplierRanking
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Supplier ranking by wins and performance score.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: './procurement-workbench.schema.json#/$defs/SupplierView'}
  /api/procurement/insights/categories:
    get:
      operationId: insightsCategories
      responses:
        '200':
          description: Task counts grouped by category.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [category, count]
                  properties:
                    category: {type: string}
                    count: {type: integer, minimum: 0}
  /api/procurement/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - name: type
          in: query
          schema: {type: string, maxLength: 100}
        - name: actor
          in: query
          schema: {type: string, maxLength: 100}
        - name: business_type
          in: query
          schema: {type: string, maxLength: 30}
        - name: task_id
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Filtered global audit event page.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items: {$ref: './procurement-workbench.schema.json#/$defs/AuditEventView'}
                  page: {type: integer, minimum: 0}
                  size: {type: integer, minimum: 1}
                  total: {type: integer, minimum: 0}
  /api/procurement/platform:
    get:
      operationId: platformInfo
      responses:
        '200':
          description: System information (version, components, parsers, rulesets, model status, LLM gateway state).
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/PlatformInfo'}
  /api/procurement/requests/{businessId}/quotes/{quoteId}/corrections:
    post:
      operationId: correctQuoteField
      parameters:
        - {$ref: '#/components/parameters/BusinessId'}
        - {$ref: '#/components/parameters/QuoteId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/QuoteCorrectionInput'}
      responses:
        '200':
          description: Corrected quote view.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ProcurementQuote'}
        '400': {description: Unknown field or chosen value outside conflict candidates.}
        '404': {description: Quote not found.}
  /api/procurement/corrections:
    get:
      operationId: listCorrections
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Human quote-correction records (P2-2 修正回灌只读接口).
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/CorrectionPage'}
  /api/procurement/requests/{businessId}/interactions:
    get:
      operationId: listHumanInteractions
      parameters: [{$ref: '#/components/parameters/BusinessId'}]
      responses:
        '200':
          description: Durable human questions for the procurement task, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: './procurement-workbench.schema.json#/$defs/HumanInteractionView'}
        '404': {description: Unknown procurement task.}
  /api/procurement/interactions/{interactionId}:
    get:
      operationId: getHumanInteraction
      parameters: [{$ref: '#/components/parameters/InteractionId'}]
      responses:
        '200':
          description: Current durable interaction state.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/HumanInteractionView'}
        '404': {description: Unknown interaction.}
  /api/procurement/interactions/{interactionId}/answer:
    post:
      operationId: answerHumanInteraction
      parameters:
        - {$ref: '#/components/parameters/InteractionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/HumanInteractionAnswerRequest'}
      responses:
        '202':
          description: Answer and durable Agent resume command were stored atomically.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ProcurementRunAccepted'}
        '409': {description: Already answered, stale, expired, cancelled, or idempotency payload conflict.}
        '422': {description: Answer does not satisfy the server-owned answer schema.}
  /api/procurement/interactions/{interactionId}/artifacts:
    post:
      operationId: uploadHumanInteractionArtifact
      parameters: [{$ref: '#/components/parameters/InteractionId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Supplemental file persisted in the Java Artifact Store and bound to this task and interaction.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/HumanInteractionArtifact'}
        '409': {description: Interaction is not waiting for input.}
        '413': {description: File exceeds the configured limit.}
        '415': {description: Unsupported supplemental file type.}
  /api/procurement/interactions/{interactionId}/retry:
    post:
      operationId: retryHumanInteractionResume
      parameters: [{$ref: '#/components/parameters/InteractionId'}]
      responses:
        '202':
          description: The original operation is re-dispatched without accepting another answer.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ProcurementRunAccepted'}
        '409': {description: Interaction has no retryable answered operation.}
  /api/procurement/interactions/{interactionId}/cancel:
    post:
      operationId: cancelHumanInteraction
      parameters: [{$ref: '#/components/parameters/InteractionId'}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: [string, 'null'], maxLength: 500}
      responses:
        '200':
          description: Waiting interaction and its task are cancelled with audit evidence.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/HumanInteractionView'}
        '409': {description: Interaction is no longer waiting.}
  /api/procurement/operations/{operationId}:
    get:
      operationId: getProcurementOperation
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200':
          description: Durable Java-to-Agent command state and result.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ProcurementOperation'}
        '404': {description: Unknown operation.}
  /api/procurement/invoices:
    post:
      operationId: uploadInvoice
      parameters:
        - name: order_id
          in: query
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202':
          description: Invoice artifact stored; Agent parses and Java three-way match follows.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ProcurementRunAccepted'}
        '409': {description: Duplicate invoice no, completed order, invalid parse result, or idempotency conflict.}
    get:
      operationId: listInvoices
      parameters:
        - name: status
          in: query
          schema: {$ref: './procurement-workbench.schema.json#/$defs/InvoiceStatus'}
        - name: order_id
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Invoice page with three-way match context.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/InvoicePage'}
  /api/procurement/invoices/{invoiceId}:
    get:
      operationId: getInvoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200':
          description: Invoice detail with three-way comparison and diff explanation.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/InvoiceView'}
        '404': {description: Unknown invoice.}
  /api/procurement/invoices/{invoiceId}/actions:
    post:
      operationId: actOnInvoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - name: action
          in: query
          required: true
          schema: {type: string, enum: [void, correct, force_match, reconcile]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/InvoiceActionInput'}
      responses:
        '200':
          description: Invoice after the state-machine-validated action.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/InvoiceView'}
        '400': {description: Missing required notes/confirmation or unknown action.}
        '409': {description: Invalid transition, concurrent modification, or payment blocked by unmatched invoice.}
  /api/procurement/contracts:
    post:
      operationId: createContractDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '202':
          description: Contract draft request accepted; Agent drafts clauses and risks.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ProcurementRunAccepted'}
        '409': {description: Task not approved, contract already exists, or cost missing.}
    get:
      operationId: listContracts
      parameters:
        - name: status
          in: query
          schema: {$ref: './procurement-workbench.schema.json#/$defs/ContractStatus'}
        - name: task_id
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Contract page with draft, clauses and consistency state.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ContractPage'}
  /api/procurement/contracts/{contractId}:
    get:
      operationId: getContract
      parameters:
        - name: contractId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200':
          description: Contract detail.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ContractView'}
        '404': {description: Unknown contract.}
  /api/procurement/contracts/{contractId}/actions:
    post:
      operationId: actOnContract
      parameters:
        - name: contractId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - name: action
          in: query
          required: true
          schema: {type: string, enum: [submit, approve, reject, execute, close, request_change]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './procurement-workbench.schema.json#/$defs/ContractActionInput'}
      responses:
        '200':
          description: Contract after the state-machine-validated action.
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ContractView'}
        '400': {description: Missing required notes/confirmation or unknown action.}
        '409': {description: Invalid transition, missing draft, consistency mismatch, or concurrent modification.}
  /api/procurement/contracts/{contractId}/regen-draft:
    post:
      operationId: regenerateContractDraft
      parameters:
        - name: contractId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '202':
          description: Re-draft request accepted (DRAFT retry or CHANGE_REQUEST revision).
          content:
            application/json:
              schema: {$ref: './procurement-workbench.schema.json#/$defs/ProcurementRunAccepted'}
        '409': {description: Contract status does not allow re-drafting.}
components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    BusinessIdQuery:
      name: business_id
      in: query
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    AiTaskId:
      name: aiTaskId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    InteractionId:
      name: interactionId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    OperationId:
      name: operationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AiStatus:
      name: status
      in: query
      schema: {$ref: './procurement-workbench.schema.json#/$defs/AiTaskStatus'}
    AiTaskType:
      name: task_type
      in: query
      schema: {$ref: './procurement-workbench.schema.json#/$defs/AiTaskType'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    PageSize:
