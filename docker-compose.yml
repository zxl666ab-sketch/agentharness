# 一键启动：docker compose up -d --build
# 数据与工作区分别持久化到 output/docker-data 与 output/docker-workspace。
services:
  caijitai:
    build: .
    image: agentharness:local
    ports:
      - "8741:8741"
    volumes:
      - ./output/docker-data:/data
      - ./output/docker-workspace:/workspace
    environment:
      AGENTHARNESS_NO_DOTENV: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8741/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
