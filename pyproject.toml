[project]
name = "agentharness"
version = "0.1.0"
description = "Long-lived, extensible Python Agent Harness with readonly React run console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=1.0",
    "playwright>=1.45",
    "aiosqlite>=0.20",
    "anyio>=4.4",
    "python-multipart>=0.0.9",
    "prompt-toolkit>=3.0.48",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "httpx>=0.27",
]

[project.scripts]
agentharness = "agentharness.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["output", ".venv", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.uv.build-backend]
source-include = ["src/agentharness/web_dist/**"]
