[project]
name = "agentharness"
version = "0.5.0"
description = "采价台：可审计的采购询价与供应商比价工作台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "openpyxl>=3.1",
    "pypdf>=5",
    "reportlab>=4.2",
    "defusedxml>=0.7",
    "pymysql>=1.1",
    "kafka-python>=2.0.2",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "playwright>=1.40",
]

[project.scripts]
agentharness = "agentharness.web_main:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["output", ".venv", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
omit = [
    "src/agentharness/web_main.py",
    "src/agentharness/api/*",
    "src/agentharness/engine/*",
    "src/agentharness/rag/*",
    "src/agentharness/security/*",
    "src/agentharness/storage/*",
    "src/agentharness/harness.py",
    "src/agentharness/session_history.py",
    "src/agentharness/tools/*",
]
