spring.application.name=procurement-service
spring.application.version=0.5.0
server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8741}
server.tomcat.max-part-count=52
# This service is local-only; never let client-supplied forwarded headers rewrite the host boundary.
server.forward-headers-strategy=none

spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/caijiatai_business?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DATABASE_USER:caijiatai}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
spring.mvc.async.request-timeout=0
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.mvc.problemdetails.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true

springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/docs

app.local-operator=${APP_LOCAL_OPERATOR:采购员}
app.artifact-root=${APP_ARTIFACT_ROOT:./data/artifacts}
app.allowed-vite-origin=${APP_ALLOWED_VITE_ORIGIN:http://127.0.0.1:5173}
app.development-mode=${APP_DEVELOPMENT_MODE:false}
# J-M5/GATE-1: comma-separated IPv4/IPv6 CIDRs allowed as business-write sources in
# addition to loopback (container topology: Docker bridge NAT, e.g. 172.16.0.0/12).
# Empty = loopback-only, the correct default for bare-metal runs.
app.trusted-networks=${APP_TRUSTED_NETWORKS:}
# Low-latency outbox dispatch: 100ms bounds the queueing delay for a newly
# accepted 202 operation while retaining the durable scheduled retry path.
app.outbox.poll-delay-ms=${APP_OUTBOX_POLL_DELAY_MS:100}

app.agent-mode=${APP_AGENT_MODE:kafka}
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}
app.demo-seed.root=${APP_DEMO_SEED_ROOT:../output/procurement-scenarios}

# K4 分布式锁与看板缓存（禁用/不可用自动回退无锁无缓存路径）
app.redis.enabled=${APP_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
# J-H1: artifact RPC responses embed a base64 body of a ≤2MB file (~2.67MB envelope);
# the default 1MB producer max.request.size / consumer max.partition.fetch.bytes rejected
# them even though the broker allows 16MB. Raise both ends to 4MB.
spring.kafka.producer.max.request.size=4194304
spring.kafka.consumer.max-partition-fetch-bytes=4194304
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.enable-idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.max.poll.records=10
# J-M3: with the DLQ backoff the poison-batch worst case must stay well under the
# consumer group rebalance threshold, so widen the poll interval to 10 minutes.
spring.kafka.consumer.properties.max.poll.interval.ms=600000
spring.kafka.listener.concurrency=1
app.internal-hmac-key=${AGENT_INTERNAL_HMAC_KEY}
spring.jackson.deserialization.fail-on-null-for-primitives=false
