spring.application.name=procurement-service
spring.application.version=0.5.0
server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8741}
server.tomcat.max-part-count=52
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/caijiatai_business?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4}
spring.datasource.username=${DATABASE_USER:caijiatai}
spring.datasource.password=${DATABASE_PASSWORD:caijiatai}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
spring.mvc.async.request-timeout=0
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.mvc.problemdetails.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true

springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/docs

app.local-operator=${APP_LOCAL_OPERATOR:采购员}
app.artifact-root=${APP_ARTIFACT_ROOT:./data/artifacts}
app.agent-base-url=${AGENT_INTERNAL_BASE_URL:http://127.0.0.1:8742}
app.agent-internal-token=${AGENT_INTERNAL_TOKEN:development-only-change-me}
app.allowed-vite-origin=${APP_ALLOWED_VITE_ORIGIN:http://127.0.0.1:5173}
app.development-mode=${APP_DEVELOPMENT_MODE:false}
app.outbox.poll-delay-ms=${APP_OUTBOX_POLL_DELAY_MS:500}

app.agent-mode=${APP_AGENT_MODE:http}
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}
app.demo-seed.root=${APP_DEMO_SEED_ROOT:../output/procurement-scenarios}
