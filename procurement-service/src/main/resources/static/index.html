    <script>
      // 首帧前设置主题，避免暗色偏好用户闪白（FOUC）；与 App.tsx 的 localStorage 键保持一致。
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      try {
        var stored = localStorage.getItem("caijiatai.theme");
        if (stored) prefersDark = stored === "dark";
      } catch (error) {
        /* localStorage 不可用时沿用系统偏好 */
      }
      if (prefersDark) document.documentElement.dataset.theme = "dark";
    </script>
